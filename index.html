<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>まるまるの学習サポート（画像切り替え版）</title>
    <style>
        :root {
            --bg-color: #FFF9E6;
            --main-color: #333333;
            --accent-pink: #FFB7C5;
            --accent-red: #FF6B6B;
            --box-bg: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Arial, sans-serif;
            color: var(--main-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px;
            background-color: var(--box-bg);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
            gap: 10px;
        }

        /* 切り替えタブ */
        .tabs {
            display: flex;
            width: 100%;
            background: #FFF0F3;
            border-radius: 20px;
            padding: 3px;
            box-sizing: border-box;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.2s;
        }

        .tab.active {
            background: #FFFFFF;
            color: #FF5C8A;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 17px;
            margin: 4px 0 2px 0;
            color: #444;
            text-align: center;
        }

        p.sub-text {
            font-size: 11px;
            color: #777;
            margin: 0;
            text-align: center;
        }

        .stage {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px 0;
        }

        .character-img {
            width: 140px;
            height: auto;
            object-fit: contain;
            transition: transform 0.2s;
        }

        .shaking {
            animation: bounce 0.35s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* サイコロ・コイン表示部 */
        .tool-display {
            width: 52px;
            height: 52px;
            background: #D93838;
            border: 2.5px solid #333;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #FFF;
            transition: transform 0.3s;
        }

        .tool-display.coin {
            background: #FFD700;
            color: #B8860B;
            border-radius: 50%;
            border: 3px solid #DAA520;
        }

        .tool-display.rolling {
            animation: spin 0.3s linear infinite;
        }

        @keyframes spin {
            0% { transform: scale(1) rotateY(0deg); }
            50% { transform: scale(1.1) rotateY(180deg); }
            100% { transform: scale(1) rotateY(360deg); }
        }

        .dice-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 6px;
            box-sizing: border-box;
        }
        .dot {
            background-color: #FFFFFF;
            border-radius: 50%;
            width: 6px;
            height: 6px;
            align-self: center;
            justify-self: center;
            opacity: 0;
        }
        .dice-1 .dot-5 { opacity: 1; }
        .dice-2 .dot-1, .dice-2 .dot-9 { opacity: 1; }
        .dice-3 .dot-1, .dice-3 .dot-5, .dice-3 .dot-9 { opacity: 1; }
        .dice-4 .dot-1, .dice-4 .dot-3, .dice-4 .dot-7, .dice-4 .dot-9 { opacity: 1; }
        .dice-5 .dot-1, .dice-5 .dot-3, .dice-5 .dot-5, .dice-5 .dot-7, .dice-5 .dot-9 { opacity: 1; }
        .dice-6 .dot-1, .dice-6 .dot-3, .dice-6 .dot-4, .dice-6 .dot-6, .dice-6 .dot-7, .dice-6 .dot-9 { opacity: 1; }

        .result-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            height: 42px;
        }

        .result-msg {
            font-size: 14px;
            font-weight: bold;
            color: #FF5C8A;
            margin: 0;
        }

        .hanamaru-stamp {
            font-size: 11px;
            color: #FF4A4A;
            background: #FFF0F3;
            padding: 2px 10px;
            border-radius: 12px;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hanamaru-stamp.show {
            opacity: 1;
            transform: scale(1);
        }

        .btn {
            background-color: #FFF0F3;
            border: 2px solid #FF8DA1;
            border-radius: 22px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #FF5C8A;
            cursor: pointer;
            box-shadow: 0 3px #FF8DA1;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px #FF8DA1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 切り替えタブ -->
        <div class="tabs">
            <div class="tab active" id="tabDice" onclick="switchMode('dice')">🎲 サイコロ</div>
            <div class="tab" id="tabCoin" onclick="switchMode('coin')">🪙 コイントス</div>
        </div>

        <div>
            <h1 id="mainTitle">さいころを ふるよ！</h1>
            <p class="sub-text" id="subText">勉強の合間に使ってね</p>
        </div>

        <div class="stage">
            <!-- 2枚の画像を切り替えるため id="charImg" を使用 -->
            <img src="marumaru_normal.png" alt="まるまる" class="character-img" id="charImg">
        </div>

        <div class="tool-display dice-1" id="toolBox">
            <div class="dice-grid" id="diceGrid">
                <div class="dot dot-1"></div><div class="dot dot-2"></div><div class="dot dot-3"></div>
                <div class="dot dot-4"></div><div class="dot dot-5"></div><div class="dot dot-6"></div>
                <div class="dot dot-7"></div><div class="dot dot-8"></div><div class="dot dot-9"></div>
            </div>
        </div>

        <div class="result-container">
            <p class="result-msg" id="resultMsg">ボタンを押してね</p>
            <div class="hanamaru-stamp" id="hanamaruStamp">💮 はなまる！よくできました！</div>
        </div>

        <button class="btn" id="rollBtn">もういちど振る</button>
    </div>

    <script>
        let currentMode = 'dice';

        const tabDice = document.getElementById('tabDice');
        const tabCoin = document.getElementById('tabCoin');
        const mainTitle = document.getElementById('mainTitle');
        const subText = document.getElementById('subText');
        const charImg = document.getElementById('charImg');
        const toolBox = document.getElementById('toolBox');
        const diceGrid = document.getElementById('diceGrid');
        const resultMsg = document.getElementById('resultMsg');
        const hanamaruStamp = document.getElementById('hanamaruStamp');
        const rollBtn = document.getElementById('rollBtn');

        // 画像のファイル名定義（必要に応じて変更してください）
        const imgNormal = "marumaru_normal.png"; // 待機中・振っているとき
        const imgHappy = "marumaru_happy.png";   // 結果が出たとき

        function switchMode(mode) {
            currentMode = mode;
            hanamaruStamp.classList.remove('show');
            charImg.classList.remove('shaking');
            charImg.src = imgNormal; // タブ切り替え時は通常画像に戻す

            if (mode === 'dice') {
                tabDice.classList.add('active');
                tabCoin.classList.remove('active');
                mainTitle.textContent = "さいころを ふるよ！";
                subText.textContent = "勉強の合間に使ってね";
                rollBtn.textContent = "もういちど振る";
                resultMsg.textContent = "ボタンを押してね";
                
                toolBox.className = "tool-display dice-1";
                diceGrid.style.display = "grid";
                toolBox.innerHTML = '';
                toolBox.appendChild(diceGrid);
            } else {
                tabCoin.classList.add('active');
                tabDice.classList.remove('active');
                mainTitle.textContent = "コイントスをするよ！";
                subText.textContent = "どっちが出るかな？";
                rollBtn.textContent = "コインを投げる";
                resultMsg.textContent = "ボタンを押してね";

                toolBox.className = "tool-display coin";
                toolBox.textContent = "表";
            }
        }

        rollBtn.addEventListener('click', () => {
            rollBtn.disabled = true;
            charImg.src = imgNormal; // 振る瞬間は通常画像
            charImg.classList.add('shaking');
            toolBox.classList.add('rolling');
            resultMsg.textContent = "ぽんっ！…";
            hanamaruStamp.classList.remove('show');

            let count = 0;
            const timer = setInterval(() => {
                if (currentMode === 'dice') {
                    const tempNum = Math.floor(Math.random() * 6) + 1;
                    toolBox.className = `tool-display rolling dice-${tempNum}`;
                } else {
                    toolBox.textContent = Math.random() < 0.5 ? "表" : "裏";
                }
                count++;

                if (count > 7) {
                    clearInterval(timer);
                    toolBox.classList.remove('rolling');
                    charImg.classList.remove('shaking');
                    
                    // 🌟 結果が出た瞬間に「嬉しい顔の画像」に切り替える！
                    charImg.src = imgHappy;

                    if (currentMode === 'dice') {
                        const finalNum = Math.floor(Math.random() * 6) + 1;
                        toolBox.className = `tool-display dice-${finalNum}`;
                        resultMsg.textContent = `${finalNum}の目が出たよ！✨`;
                    } else {
                        const finalCoin = Math.random() < 0.5 ? "表" : "裏";
                        toolBox.textContent = finalCoin;
                        resultMsg.textContent = `結果は「${finalCoin}」だよ！✨`;
                    }

                    hanamaruStamp.classList.add('show');
                    rollBtn.disabled = false;
                }
            }, 70);
        });
    </script>
</body>
</html>
